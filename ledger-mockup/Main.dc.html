<!doctype html>
<html>
<head>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EDEAE3;}
  .app{width:390px;height:844px;position:relative;overflow:hidden;background:#FAF9F7;font-family:'Manrope',system-ui,sans-serif;color:#15130F;display:flex;flex-direction:column;}
  .num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;}
  a{color:#2A78D6;} a:hover{color:#1c5cab;}
  .safe-top{height:54px;flex-shrink:0;}
  .header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px 12px 20px;}
  .month-nav{display:flex;align-items:center;gap:6px;}
  .month-label{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:18px;letter-spacing:-0.2px;}
  .icon-btn{width:32px;height:32px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;background:transparent;color:#6B675F;padding:0;}
  .icon-btn.outline{border:1px solid #E7E3DA;background:#fff;color:#15130F;}
  .content{flex:1;min-height:0;overflow-y:auto;padding:0 20px 20px 20px;display:flex;flex-direction:column;gap:14px;}
  .summary-card{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(21,19,15,0.06),0 8px 20px rgba(21,19,15,0.05);display:flex;align-items:center;padding:16px 8px;}
  .summary-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .s-label{font-size:11px;color:#9B9790;font-weight:600;}
  .s-value{font-size:15px;font-weight:700;}
  .s-value.income{color:#2A78D6;} .s-value.expense{color:#E34948;}
  .summary-div{width:1px;height:28px;background:#E7E3DA;}
  .cal-card{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(21,19,15,0.06),0 8px 20px rgba(21,19,15,0.05);padding:14px 10px 6px 10px;}
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:700;color:#9B9790;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid #EFECE5;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:56px;}
  .day{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding-top:4px;border-radius:10px;}
  .d-num{font-size:13px;font-weight:600;color:#15130F;}
  .day.today .d-num{width:22px;height:22px;border-radius:50%;background:#15130F;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .d-amt{font-size:8.5px;font-weight:700;}
  .d-amt.pos{color:#2A78D6;} .d-amt.neg{color:#E34948;}
  .preview-title{font-size:13px;font-weight:700;color:#6B675F;padding:2px 2px 2px 2px;}
  .tx-row{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(21,19,15,0.05);display:flex;align-items:center;padding:12px 14px;gap:12px;}
  .cat-circle{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}
  .tx-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .tx-name{font-size:14px;font-weight:600;}
  .tx-memo{font-size:12px;color:#9B9790;}
  .tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .tx-amt{font-size:14px;font-weight:700;color:#E34948;}
  .tx-time{font-size:11px;color:#9B9790;}
  .add-row{border:1.5px dashed #DAD5C9;border-radius:16px;padding:12px;text-align:center;font-size:13px;font-weight:700;color:#9B9790;}
  .fab{position:absolute;right:20px;bottom:117px;width:56px;height:56px;border-radius:50%;background:#15130F;border:none;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(21,19,15,0.28);}
  .tabbar{flex-shrink:0;display:flex;border-top:1px solid #EFECE5;background:#fff;padding-top:8px;padding-bottom:30px;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#B4B0A7;}
  .tab.active{color:#15130F;}
  .tab-label{font-size:10px;font-weight:600;}
</style>
</helmet>
<div class="app">
  <div class="safe-top"></div>
  <div class="header">
    <div class="month-nav">
      <button class="icon-btn"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4l-6 6 6 6"/></svg></button>
      <span class="month-label">2026년 8월</span>
      <button class="icon-btn"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></button>
    </div>
    <button class="icon-btn outline">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="3" y1="6" x2="17" y2="6"/><circle cx="12" cy="6" r="1.8" fill="#fff"/>
        <line x1="3" y1="10" x2="17" y2="10"/><circle cx="7" cy="10" r="1.8" fill="#fff"/>
        <line x1="3" y1="14" x2="17" y2="14"/><circle cx="13" cy="14" r="1.8" fill="#fff"/>
      </svg>
    </button>
  </div>
  <div class="content">
    <div class="summary-card">

      <div class="cal-grid">
        <div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div>
        <div class="day"><span class="d-num">1</span></div>

        <div class="day"><span class="d-num">2</span></div>

        <div class="day"><span class="d-num">6</span></div>
        <div class="day"><span class="d-num">7</span></div>
        <div class="day"><span class="d-num">8</span></div>

        <div class="day"><span class="d-num">9</span></div>
        <div class="day"><span class="d-num">10</span><span class="d-amt neg num">-1.5만</span></div>
        <div class="day"><span class="d-num">11</span></div>
        <div class="day"><span class="d-num">12</span></div>
        <div class="day"><span class="d-num">13</span></div>
        <div class="day"><span class="d-num">14</span><span class="d-amt neg num">-4.5만</span></div>
        <div class="day"><span class="d-num">15</span></div>

        <div class="day"><span class="d-num">16</span></div>
        <div class="day"><span class="d-num">17</span><span class="d-amt neg num">-6,000</span></div>
        <div class="day"><span class="d-num">18</span></div>
        <div class="day"><span class="d-num">19</span></div>
        <div class="day"><span class="d-num">20</span><span class="d-amt neg num">-12만</span></div>
        <div class="day"><span class="d-num">21</span></div>
        <div class="day"><span class="d-num">22</span></div>

        <div class="day"><span class="d-num">23</span><span class="d-amt neg num">-9,800</span></div>
        <div class="day"><span class="d-num">24</span></div>
        <div class="day"><span class="d-num">25</span><span class="d-amt pos num">+250만</span></div>
        <div class="day"><span class="d-num">26</span></div>
        <div class="day"><span class="d-num">27</span></div>
        <div class="day"><span class="d-num">28</span><span class="d-amt neg num">-3.3만</span></div>
        <div class="day"><span class="d-num">29</span></div>

        <div class="day today"><span class="d-num">30</span><span class="d-amt neg num">-8,500</span></div>
        <div class="day"><span class="d-num">31</span></div>
        <div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div>
      </div>
    </div>

    <div class="preview-title">8월 30일 일요일 · 오늘</div>
    <div class="tx-row">
      <div class="cat-circle" style="background:#EB6834">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 3v6M8 3v3a1 1 0 01-2 0V3M7 9v8"/><path d="M14 3s-2 1-2 4 2 3 2 3v6"/></svg>
      </div>
      <div class="tx-mid"><span class="tx-name">저녁 식사</span><span class="tx-memo">김밥천국</span></div>
      <div class="tx-right"><span class="tx-amt num">-8,500</span><span class="tx-time">19:32</span></div>
    </div>
    <div class="add-row">+ 새 거래 추가</div>
  </div>

  <button class="fab"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg></button>

  <div class="tabbar">
    <div class="tab active"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="12" rx="2.5"/><line x1="3" y1="8.5" x2="17" y2="8.5"/><line x1="7" y1="2.5" x2="7" y2="6"/><line x1="13" y1="2.5" x2="13" y2="6"/></svg><span class="tab-label">캘린더</span></div>

    <div class="tab"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><line x1="5" y1="15" x2="5" y2="11"/><line x1="10" y1="15" x2="10" y2="7"/><line x1="15" y1="15" x2="15" y2="4"/></svg><span class="tab-label">대시보드</span></div>
    <div class="tab"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2v-8z"/><circle cx="13.5" cy="10.5" r="1.1" fill="currentColor" stroke="none"/></svg><span class="tab-label">관리</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
