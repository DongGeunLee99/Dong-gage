<!doctype html>
<html>
<head>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EDEAE3;}
  .app{width:390px;height:844px;position:relative;overflow:hidden;background:#FAF9F7;font-family:'Manrope',system-ui,sans-serif;color:#15130F;display:flex;flex-direction:column;}
  .num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;}
  a{color:#2A78D6;} a:hover{color:#1c5cab;}
  .safe-top{height:54px;flex-shrink:0;}
  .title-row{flex-shrink:0;padding:0 20px 14px 20px;}
  .title{font-family:'Space Grotesk',system-ui,sans-serif;font-size:24px;font-weight:700;}
  .content{flex:1;min-height:0;overflow-y:auto;padding:0 20px 20px 20px;display:flex;flex-direction:column;gap:22px;}
  .section{display:flex;flex-direction:column;gap:8px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px;}
  .section-title{font-size:13px;font-weight:700;color:#9B9790;text-transform:uppercase;letter-spacing:0.3px;}
  .add-link{font-size:13px;font-weight:700;color:#2A78D6;background:none;border:none;padding:0;}
  .group-card{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(21,19,15,0.05);overflow:hidden;}
  .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid #F0EEE8;}
  .row:last-child{border-bottom:none;}
  .icon-sq{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .row-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .row-name{font-size:14.5px;font-weight:600;}
  .row-sub{font-size:12px;color:#9B9790;}
  .row-amt{font-size:14px;font-weight:700;color:#E34948;}
  .switch{width:38px;height:22px;border-radius:11px;position:relative;flex-shrink:0;}
  .switch.on{background:#15130F;}
  .switch.off{background:#E7E3DA;}
  .switch-knob{position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.2);}
  .switch.on .switch-knob{left:18px;}
  .switch.off .switch-knob{left:2px;}
  .chev{color:#DAD5C9;flex-shrink:0;}
  .tabbar{flex-shrink:0;display:flex;border-top:1px solid #EFECE5;background:#fff;padding-top:8px;padding-bottom:30px;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#B4B0A7;}
  .tab.active{color:#15130F;}
  .tab-label{font-size:10px;font-weight:600;}
</style>
</helmet>
<div class="app">
  <div class="safe-top"></div>
  <div class="title-row"><span class="title">관리</span></div>

  <div class="content">
    <div class="section">
      <div class="section-head"><span class="section-title">예산 설정</span><button class="add-link">+ 카테고리 추가</button></div>
      <div class="group-card">
        <div class="row">
          <div class="icon-sq" style="background:#15130F"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3.5"/><circle cx="10" cy="10" r="0.9" fill="#fff" stroke="none"/></svg></div>
          <div class="row-mid"><span class="row-name">이번 달 목표</span><span class="row-sub">고정지출 제외</span></div>
          <span class="row-amt num" style="color:#15130F">1,000,000</span>
          <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></span>
        </div>
        <div class="row">
          <div class="icon-sq" style="background:#EB6834"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 3v6M8 3v3a1 1 0 01-2 0V3M7 9v8"/><path d="M14 3s-2 1-2 4 2 3 2 3v6"/></svg></div>
          <div class="row-mid"><span class="row-name">식비</span></div>
          <span class="row-amt num" style="color:#15130F">800,000</span>
          <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></span>
        </div>
        <div class="row">
          <div class="icon-sq" style="background:#1BAF7A"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V8a2 2 0 012-2h8a2 2 0 012 2v4"/><path d="M3 12h14v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2z"/><circle cx="6.5" cy="15.5" r="1.1" fill="#fff"/><circle cx="13.5" cy="15.5" r="1.1" fill="#fff"/></svg></div>
          <div class="row-mid"><span class="row-name">교통(주유)</span></div>
          <span class="row-amt num" style="color:#15130F">200,000</span>
          <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><span class="section-title">고정 지출</span><button class="add-link">+ 추가</button></div>
      <div class="group-card">
        <div class="row">
          <div class="icon-sq" style="background:#4A3AA7"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9l-2-2M16 13H7l2 2"/></svg></div>
          <div class="row-mid"><span class="row-name">월세</span><span class="row-sub">매월 25일</span></div>
          <span class="row-amt num">-700,000</span>
          <div class="switch on"><div class="switch-knob"></div></div>
        </div>
        <div class="row">
          <div class="icon-sq" style="background:#4A3AA7"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9l-2-2M16 13H7l2 2"/></svg></div>
          <div class="row-mid"><span class="row-name">통신비</span><span class="row-sub">매월 25일</span></div>
          <span class="row-amt num">-55,000</span>
          <div class="switch on"><div class="switch-knob"></div></div>
        </div>
        <div class="row">
          <div class="icon-sq" style="background:#4A3AA7"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9l-2-2M16 13H7l2 2"/></svg></div>
          <div class="row-mid"><span class="row-name">넷플릭스 구독</span><span class="row-sub">매월 5일</span></div>
          <span class="row-amt num">-13,500</span>
          <div class="switch on"><div class="switch-knob"></div></div>
        </div>
        <div class="row">
          <div class="icon-sq" style="background:#DAD5C9"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9l-2-2M16 13H7l2 2"/></svg></div>
          <div class="row-mid"><span class="row-name">헬스장</span><span class="row-sub">매월 1일 · 일시중지</span></div>
          <span class="row-amt num" style="color:#B4B0A7">-89,000</span>
          <div class="switch off"><div class="switch-knob"></div></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><span class="section-title">카테고리</span><button class="add-link">+ 추가</button></div>
      <div class="group-card">
        <div class="row">
          <div class="icon-sq" style="background:#EB6834"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 3v6M8 3v3a1 1 0 01-2 0V3M7 9v8"/><path d="M14 3s-2 1-2 4 2 3 2 3v6"/></svg></div>
          <span class="row-name" style="flex:1">식비</span>
          <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></span>
        </div>
        <div class="row">
          <div class="icon-sq" style="background:#1BAF7A"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V8a2 2 0 012-2h8a2 2 0 012 2v4"/><path d="M3 12h14v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2z"/><circle cx="6.5" cy="15.5" r="1.1" fill="#fff"/><circle cx="13.5" cy="15.5" r="1.1" fill="#fff"/></svg></div>
          <span class="row-name" style="flex:1">교통</span>
          <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></span>
        </div>
        <div class="row">
          <div class="icon-sq" style="background:#E87BA4"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h10l-1 9a1 1 0 01-1 1H7a1 1 0 01-1-1L5 7z"/><path d="M8 7V5a2 2 0 014 0v2"/></svg></div>
          <span class="row-name" style="flex:1">쇼핑</span>
          <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></span>
        </div>
        <div class="row">
          <div class="icon-sq" style="background:#4A3AA7"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9l-2-2M16 13H7l2 2"/></svg></div>
          <span class="row-name" style="flex:1">고정비</span>
          <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></span>
        </div>
        <div class="row">
          <div class="icon-sq" style="background:#EDA100"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><circle cx="7" cy="10" r=".9" fill="#fff" stroke="none"/><circle cx="10" cy="10" r=".9" fill="#fff" stroke="none"/><circle cx="13" cy="10" r=".9" fill="#fff" stroke="none"/></svg></div>
          <span class="row-name" style="flex:1">기타</span>
          <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></span>
        </div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="12" rx="2.5"/><line x1="3" y1="8.5" x2="17" y2="8.5"/><line x1="7" y1="2.5" x2="7" y2="6"/><line x1="13" y1="2.5" x2="13" y2="6"/></svg><span class="tab-label">캘린더</span></div>
    <div class="tab"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="4" cy="6" r="1.1" fill="currentColor" stroke="none"/><line x1="8" y1="6" x2="17" y2="6"/><circle cx="4" cy="10" r="1.1" fill="currentColor" stroke="none"/><line x1="8" y1="10" x2="17" y2="10"/><circle cx="4" cy="14" r="1.1" fill="currentColor" stroke="none"/><line x1="8" y1="14" x2="17" y2="14"/></svg><span class="tab-label">리스트</span></div>
    <div class="tab"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><line x1="5" y1="15" x2="5" y2="11"/><line x1="10" y1="15" x2="10" y2="7"/><line x1="15" y1="15" x2="15" y2="4"/></svg><span class="tab-label">대시보드</span></div>
    <div class="tab active"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2v-8z"/><circle cx="13.5" cy="10.5" r="1.1" fill="currentColor" stroke="none"/></svg><span class="tab-label">관리</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
