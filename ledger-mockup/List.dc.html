<!doctype html>
<html>
<head>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EDEAE3;}
  .app{width:390px;height:844px;position:relative;overflow:hidden;background:#FAF9F7;font-family:'Manrope',system-ui,sans-serif;color:#15130F;display:flex;flex-direction:column;}
  .num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;}
  a{color:#2A78D6;} a:hover{color:#1c5cab;}
  .safe-top{height:54px;flex-shrink:0;}
  .title-row{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px 10px 20px;}
  .title{font-family:'Space Grotesk',system-ui,sans-serif;font-size:24px;font-weight:700;}
  .icon-btn{width:32px;height:32px;border-radius:50%;border:1px solid #E7E3DA;background:#fff;display:flex;align-items:center;justify-content:center;color:#15130F;padding:0;}
  .month-nav{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;padding-bottom:12px;}
  .month-label{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:15px;color:#6B675F;}
  .chev{color:#B4B0A7;display:flex;}
  .segmented{flex-shrink:0;margin:0 20px 14px 20px;background:#EFECE5;border-radius:12px;padding:3px;display:flex;gap:2px;}
  .seg{flex:1;text-align:center;padding:8px 0;border-radius:9px;font-size:13px;font-weight:700;color:#9B9790;}
  .seg.active{background:#fff;color:#15130F;box-shadow:0 1px 3px rgba(21,19,15,0.12);}
  .content{flex:1;min-height:0;overflow-y:auto;padding:0 20px 20px 20px;display:flex;flex-direction:column;gap:16px;}
  .day-group{display:flex;flex-direction:column;gap:8px;}
  .day-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px;}
  .day-head-left{font-size:12.5px;font-weight:700;color:#9B9790;}
  .day-head-right{font-size:12.5px;font-weight:700;}
  .tx-row{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(21,19,15,0.05);display:flex;align-items:center;padding:12px 14px;gap:12px;}
  .cat-circle{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}
  .tx-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .tx-name{font-size:14px;font-weight:600;}
  .tx-memo{font-size:12px;color:#9B9790;}
  .tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .tx-amt{font-size:14.5px;font-weight:700;}
  .tx-amt.neg{color:#E34948;} .tx-amt.pos{color:#2A78D6;}
  .tx-time{font-size:11px;color:#9B9790;}
  .tabbar{flex-shrink:0;display:flex;border-top:1px solid #EFECE5;background:#fff;padding-top:8px;padding-bottom:30px;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#B4B0A7;}
  .tab.active{color:#15130F;}
  .tab-label{font-size:10px;font-weight:600;}
</style>
</helmet>
<div class="app">
  <div class="safe-top"></div>
  <div class="title-row">
    <span class="title">내역</span>
    <button class="icon-btn"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="3" y1="6" x2="17" y2="6"/><circle cx="12" cy="6" r="1.8" fill="#fff"/><line x1="3" y1="10" x2="17" y2="10"/><circle cx="7" cy="10" r="1.8" fill="#fff"/><line x1="3" y1="14" x2="17" y2="14"/><circle cx="13" cy="14" r="1.8" fill="#fff"/></svg></button>
  </div>
  <div class="month-nav">
    <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4l-6 6 6 6"/></svg></span>
    <span class="month-label">2026년 8월</span>
    <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></span>
  </div>
  <div class="segmented">
    <div class="seg active">전체</div>
    <div class="seg">지출</div>
    <div class="seg">수입</div>
  </div>

  <div class="content">
    <div class="day-group">
      <div class="day-head"><span class="day-head-left">8월 30일 일요일 · 오늘</span><span class="day-head-right num" style="color:#E34948">-8,500</span></div>
      <div class="tx-row">
        <div class="cat-circle" style="background:#EB6834"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 3v6M8 3v3a1 1 0 01-2 0V3M7 9v8"/><path d="M14 3s-2 1-2 4 2 3 2 3v6"/></svg></div>
        <div class="tx-mid"><span class="tx-name">저녁 식사</span><span class="tx-memo">김밥천국</span></div>
        <div class="tx-right"><span class="tx-amt neg num">-8,500</span><span class="tx-time">19:32</span></div>
      </div>
    </div>

    <div class="day-group">
      <div class="day-head"><span class="day-head-left">8월 28일 금요일</span><span class="day-head-right num" style="color:#E34948">-33,000</span></div>
      <div class="tx-row">
        <div class="cat-circle" style="background:#E87BA4"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h10l-1 9a1 1 0 01-1 1H7a1 1 0 01-1-1L5 7z"/><path d="M8 7V5a2 2 0 014 0v2"/></svg></div>
        <div class="tx-mid"><span class="tx-name">생활용품</span><span class="tx-memo">다이소</span></div>
        <div class="tx-right"><span class="tx-amt neg num">-33,000</span><span class="tx-time">14:10</span></div>
      </div>
    </div>

    <div class="day-group">
      <div class="day-head"><span class="day-head-left">8월 25일 화요일</span><span class="day-head-right num" style="color:#2A78D6">+2,500,000</span></div>
      <div class="tx-row">
        <div class="cat-circle" style="background:#2A78D6"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l4-5 3 3.5 5-6.5"/><path d="M12 3.5h4V8"/></svg></div>
        <div class="tx-mid"><span class="tx-name">월급</span><span class="tx-memo">8월 급여</span></div>
        <div class="tx-right"><span class="tx-amt pos num">+2,500,000</span><span class="tx-time">09:00</span></div>
      </div>
      <div class="tx-row">
        <div class="cat-circle" style="background:#4A3AA7"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9l-2-2M16 13H7l2 2"/></svg></div>
        <div class="tx-mid"><span class="tx-name">통신비</span><span class="tx-memo">고정지출</span></div>
        <div class="tx-right"><span class="tx-amt neg num">-55,000</span><span class="tx-time">09:05</span></div>
      </div>
    </div>

    <div class="day-group">
      <div class="day-head"><span class="day-head-left">8월 23일 일요일</span><span class="day-head-right num" style="color:#E34948">-9,800</span></div>
      <div class="tx-row">
        <div class="cat-circle" style="background:#1BAF7A"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V8a2 2 0 012-2h8a2 2 0 012 2v4"/><path d="M3 12h14v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2z"/><circle cx="6.5" cy="15.5" r="1.1" fill="#fff"/><circle cx="13.5" cy="15.5" r="1.1" fill="#fff"/></svg></div>
        <div class="tx-mid"><span class="tx-name">버스·지하철</span><span class="tx-memo">교통카드 충전</span></div>
        <div class="tx-right"><span class="tx-amt neg num">-9,800</span><span class="tx-time">08:12</span></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="12" rx="2.5"/><line x1="3" y1="8.5" x2="17" y2="8.5"/><line x1="7" y1="2.5" x2="7" y2="6"/><line x1="13" y1="2.5" x2="13" y2="6"/></svg><span class="tab-label">캘린더</span></div>
    <div class="tab active"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="4" cy="6" r="1.1" fill="currentColor" stroke="none"/><line x1="8" y1="6" x2="17" y2="6"/><circle cx="4" cy="10" r="1.1" fill="currentColor" stroke="none"/><line x1="8" y1="10" x2="17" y2="10"/><circle cx="4" cy="14" r="1.1" fill="currentColor" stroke="none"/><line x1="8" y1="14" x2="17" y2="14"/></svg><span class="tab-label">리스트</span></div>
    <div class="tab"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><line x1="5" y1="15" x2="5" y2="11"/><line x1="10" y1="15" x2="10" y2="7"/><line x1="15" y1="15" x2="15" y2="4"/></svg><span class="tab-label">대시보드</span></div>
    <div class="tab"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2v-8z"/><circle cx="13.5" cy="10.5" r="1.1" fill="currentColor" stroke="none"/></svg><span class="tab-label">관리</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
